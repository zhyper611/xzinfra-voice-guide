    answer: >-
      室外区域首先展示 2N 配置的配电站，它由两台 2 MW 机组组成，任何一台机组出现故障，另一台都能接管全部负载，保障智算中心持续运行。旁边是液冷冷却塔和风冷空调室外机，液冷系统吸收的热量会在这里集中交换和散发。室外还配置了 4 MW 全浸没式锂电池储能系统，它既可以作为应急电源，也能参与微电网削峰填谷。
