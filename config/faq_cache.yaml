    answer: >-
      算电协同区域展示的是园区核心的源网荷储解决方案。园区计划建设每日供电量可达 1 MW 的光伏设施，可覆盖园区约三分之二的日用电需求；夜间利用谷电为储能系统充能，通过微电网实现削峰填谷。储能方案采用全浸没式液态锂电池，并配置 4 MW 储备能力。微电网配电站采用 2N 配置，以提高智算中心供电的可用性。
