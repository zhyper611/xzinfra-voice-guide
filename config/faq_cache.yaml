    answer: >-
      硬件产品区展示的是调推智算中心的底层算力基础。面对大模型架构和芯片体系的快速发展，我们将不同类型的国产芯片整合起来，并进行加速、调优、适配和优化。这样可以在同等硬件和能耗条件下产生更多 Token，提高算力利用效率，也为企业提供更加自主可控的 AI 基础设施。
    audio_file: prepared_audio/domestic_compute_optimization.wav

  - id: pd_disaggregation
    title: PD 分离技术
    enabled: true
    priority: high
    version: 1
    aliases:
      - 什么是 PD 分离
      - 介绍一下 PD 分离技术
      - PD 分离有什么作用
      - Prefill 和 Decode 为什么要分离
      - PD 分离能提升多少性能
      - 你们怎么提升大模型推理性能
    answer: >-
      PD 分离是我们的核心优化技术之一。大模型生成过程主要包含 Prefill 和 Decode 两个关键阶段，PD 分离技术将这两个阶段解耦，并针对不同负载分别进行优化，从而显著提升硬件的推理性能。根据现有测试数据，经过 PD 分离调优的算力，相比未经优化的原生算力可获得五倍以上的性能提升，也就是说，企业投入同样的资金，可以获得更高的 AI 服务能力。
    audio_file: prepared_audio/pd_disaggregation.wav

