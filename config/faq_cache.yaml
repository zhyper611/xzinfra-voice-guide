  - id: cooling_solutions
    title: 机房风冷与全浸没式液冷方案
    enabled: true
    priority: high
    version: 1
    aliases:
      - 介绍一下机房
      - 风冷和液冷有什么区别
      - 什么是全浸没式液冷
      - 液冷方案有哪些优势
      - 液冷缸里有多少台服务器
      - 机房的 PUE 是多少
    answer: >-
      机房同时展示风冷和全浸没式液冷两种散热方案。风冷单个机柜的功率密度可达 30 kW，通过机柜之间的空调柜为整个通道散热。全浸没式液冷方案将 16 台服务器放入液冷缸中，单缸功率密度可达 120 kW，是传统风冷的四倍，PUE 可达到 1.08。缸内服务器支持单独吊装和热插拔，散热液体性质稳定、挥发性低，理论上十年内不需要补液或换液。
    audio_file: prepared_audio/cooling_solutions.wav

