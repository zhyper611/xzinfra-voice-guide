      subjects:
        - 八大车间
        - 八个车间
        - AI 工厂车间
        - AI 工厂的车间
      intents:
        - 介绍
        - 讲讲
        - 讲一讲
        - 说说
        - 了解
        - 有哪些
        - 都有什么
        - 分别做什么
        - 怎么组成
      excludes:
        - 案例
        - 视频
        - 图片
    answer: >-
      欢迎来到 AI 工厂。八大车间共同组成了一条企业级 AI 生产线：算力车间统一管理算力和模型；数据精炼厂把企业数据转化为洞察；知识铸造炉把零散资料沉淀为知识资产；深思实验室负责研究、分析和学习；代码车间把需求转化为网页、脚本和工具；创意车间生成并处理视觉内容；Agent 总装车间把前面的能力组装成能够执行任务的智能体；交互大厅则把所有能力变成用户可以实时对话和使用的统一入口。这八个车间层层衔接，完成了企业 AI 从底层资源到最终应用的完整过程。
    audio_file: prepared_audio/eight_workshops_overview.wav

